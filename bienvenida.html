<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<script>if(location.hostname==="canica.fun"){location.replace("https://www.canica.fun"+location.pathname+location.search);}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Canica · Condesa, CDMX</title>
<meta name="robots" content="noindex" />

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23FFF9F1'/><text x='50' y='66' font-family='Georgia,serif' font-style='italic' font-size='52' text-anchor='middle' fill='%23BF5341'>c</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<style>
  .bienvenida-wrap {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px 56px;
    text-align: center;
  }
  .bienvenida-logo {
    display: block;
    height: 28px;
    margin-bottom: 12px;
  }
  .bienvenida-tagline {
    font-family: var(--body);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(26,20,17,0.4);
    margin-bottom: 52px;
  }
  .bienvenida-nav {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 320px;
  }
  .bienvenida-nav .btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 16px 22px;
    text-align: left;
    cursor: pointer;
    text-decoration: none;
  }
  .bienvenida-nav .btn-body {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .bienvenida-nav .btn-title {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .bienvenida-nav .btn-sub {
    font-size: 10px;
    opacity: 0.55;
    text-transform: none;
    letter-spacing: 0;
  }
  .bienvenida-nav .btn-arrow {
    font-size: 14px;
    opacity: 0.6;
    flex-shrink: 0;
    margin-left: 12px;
  }
  .bienvenida-footer {
    margin-top: 44px;
    font-family: var(--body);
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(26,20,17,0.25);
  }

  /* WiFi bottom sheet */
  .wifi-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,20,17,0.5);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .wifi-overlay.open { display: flex; }
  .wifi-sheet {
    background: var(--ivory);
    width: 100%;
    max-width: 420px;
    padding: 32px 28px 40px;
    border-top: 1px solid rgba(26,20,17,0.12);
  }
  .wifi-sheet h2 {
    font-family: var(--display);
    font-size: 28px;
    font-style: italic;
    font-weight: 400;
    margin-bottom: 24px;
  }
  .wifi-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid rgba(26,20,17,0.08);
  }
  .wifi-row:last-of-type { border-bottom: none; margin-bottom: 4px; }
  .wifi-label {
    font-family: var(--body);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(26,20,17,0.4);
    margin-bottom: 4px;
  }
  .wifi-val {
    font-family: var(--body);
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
  }
  .copy-btn {
    font-family: var(--body);
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: 1px solid rgba(26,20,17,0.2);
    background: transparent;
    padding: 6px 12px;
    cursor: pointer;
    color: var(--ink);
    border-radius: 999px;
    flex-shrink: 0;
    margin-left: 12px;
  }
  .copy-btn.copied { color: var(--green); border-color: var(--green); }
  .wifi-close {
    margin-top: 20px;
    width: 100%;
  }
</style>
</head>
<body>

<div class="bienvenida-wrap">
  <a href="/" aria-label="Canica">
    <img class="bienvenida-logo" src="assets/canica-wordmark-vector.svg" alt="canica">
  </a>
  <p class="bienvenida-tagline">Mazatlán 83 · Condesa · CDMX</p>

  <nav class="bienvenida-nav">

    <a class="btn" href="/ludoteca-checkin" style="color:#be352b;border-color:rgba(190,53,43,.25)">
      <span class="btn-body">
        <span class="btn-title">Check-in ludoteca</span>
        <span class="btn-sub">Registra la entrada de tu niño/a</span>
      </span>
      <span class="btn-arrow">→</span>
    </a>

    <a class="btn" href="/menu" style="color:#1A1411">
      <span class="btn-body">
        <span class="btn-title">Menú</span>
        <span class="btn-sub">Ver nuestra carta</span>
      </span>
      <span class="btn-arrow">→</span>
    </a>

    <a class="btn" href="https://app.loyalzclub.com/getpass/1087591?utm_source=qr" target="_blank" rel="noopener" style="color:#5273c6;border-color:rgba(82,115,198,.25)">
      <span class="btn-body">
        <span class="btn-title">Club de Fans</span>
        <span class="btn-sub">Acumula puntos y gana recompensas</span>
      </span>
      <span class="btn-arrow">★</span>
    </a>

    <a class="btn" href="/membership" style="color:#107039;border-color:rgba(16,112,57,.25)">
      <span class="btn-body">
        <span class="btn-title">Canica Commons</span>
        <span class="btn-sub">Membresía desde $950/mes</span>
      </span>
      <span class="btn-arrow">◆</span>
    </a>

    <button class="btn" onclick="document.getElementById('wifi-overlay').classList.add('open')" style="color:rgba(26,20,17,.45)">
      <span class="btn-body">
        <span class="btn-title">WiFi</span>
        <span class="btn-sub">Conéctate gratis</span>
      </span>
      <span class="btn-arrow">⌘</span>
    </button>

  </nav>

  <p class="bienvenida-footer">Lun–Dom · 9:00–19:30 h</p>
</div>

<!-- WiFi Sheet -->
<div class="wifi-overlay" id="wifi-overlay" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="wifi-sheet">
    <h2>WiFi Canica</h2>

    <div class="wifi-row">
      <div>
        <div class="wifi-label">Red</div>
        <div class="wifi-val" id="ssid-val">Totalplay-5G-da68</div>
      </div>
      <button class="copy-btn" onclick="copyVal('ssid-val',this)">Copiar</button>
    </div>

    <div class="wifi-row">
      <div>
        <div class="wifi-label">Contraseña</div>
        <div class="wifi-val" id="pass-val">jQZsXaMR5ScDpkZf</div>
      </div>
      <button class="copy-btn" onclick="copyVal('pass-val',this)">Copiar</button>
    </div>

    <button class="btn btn--primary wifi-close" onclick="document.getElementById('wifi-overlay').classList.remove('open')">
      Cerrar
    </button>
  </div>
</div>

<script>
function copyVal(id, btn) {
  const text = document.getElementById(id).textContent.trim();
  (navigator.clipboard?.writeText(text) || Promise.reject())
    .catch(() => {
      const el = document.createElement('textarea');
      el.value = text; document.body.appendChild(el);
      el.select(); document.execCommand('copy');
      document.body.removeChild(el);
    })
    .finally(() => {
      btn.textContent = '✓ Copiado';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copiar'; btn.classList.remove('copied'); }, 2000);
    });
}
</script>

</body>
</html>
